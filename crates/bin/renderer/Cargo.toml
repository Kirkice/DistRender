[package]
name = "renderer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dist-render = { path = "../../lib/dist-render" }
dist-render-simple = { path = "../../lib/dist-render-simple", features = ["egui", "winit_serde"] }
dist-render-asset-pipe = { path = "../../lib/dist-render-asset-pipe"}

anyhow = "1.0"
dolly = "=0.4.0"
egui = { version = "0.15", default-features = false, features = ["default_fonts", "single_threaded"] }
log = "0.4"
ron = "0.6.2"
serde = { version = "1.0", features = ["derive"] }
structopt = "0.3"
toml = "0.7.2"
splines = { version = "4.2.0", features = ["glam"] }

[features]
dlss = ["dist-render/dlss"]
puffin-server = ['dist-render-simple/puffin-server']
